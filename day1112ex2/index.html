<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @font-face {
            font-family: 'DungGeunMo'; 
            src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        body {
            background-color: rgb(0, 0, 255); 
            color: white; 
            display: flex;
            justify-content: center; 
            align-items: center;   
            min-height: 100vh;     
            margin: 0;             
            font-family: sans-serif; 
        }

        main {
            text-align: center;
        }

        .title {
            font-family: 'DungGeunMo', sans-serif; 
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .menu-item {
            font-family: 'DungGeunMo', sans-serif; 
            font-size: 1.5em;
            margin: 20px 0;
            cursor: pointer; 
            opacity: 0.7; 
        }

        .menu-item:hover {
            opacity: 1;
        }

        #version {
            position: fixed;
            top: 10px;
            right: 15px;
            font-size: 0.9em;
            opacity: 0.8; 
        }

        #copyright {
            position: fixed;
            bottom: 10px;
            left: 15px;
            font-size: 0.9em;
            opacity: 0.8; 
        }

        .menu-item.selected {
            opacity: 1; 
            color: yellow; 
        }

        .menu-item.selected::before {
            content: '▶ '; 
            color: yellow;
        }

    </style>
</head>
<body>
    <header>
        <div id="version">version 1.0</div>
    </header>

    <main>
        <div class="title">Dungun & Dragons</div>
        <div class="menu-item" data-action="start">New</div>
        <div class="menu-item" data-action="load">Load</div>
        <div class="menu-item" data-action="option">Option</div>
    </main>

    <footer>
        <div id="copyright">copyright jj.ac.kr</div>
    </footer>

    <script type="module">
        const menuItems = document.querySelectorAll('.menu-item');
        let currentIndex = 0; 

        function updateSelection() {
            menuItems.forEach(item => {
                item.classList.remove('selected');
            });

            menuItems[currentIndex].classList.add('selected');
        }

        function handleKeydown(event) {
            
            switch (event.key) {
                case 'ArrowDown':
                    event.preventDefault(); 
                    currentIndex = (currentIndex + 1) % menuItems.length;
                    updateSelection(); 
                    break;
                
                case 'ArrowUp':
                    event.preventDefault(); 
                    currentIndex = (currentIndex - 1 + menuItems.length) % menuItems.length;
                    updateSelection(); 
                    break;

                case 'Enter':
                    const selectedAction = menuItems[currentIndex].dataset.action;
                    console.log(`선택된 메뉴: ${selectedAction}`);
                    break;
            }
        }

        document.addEventListener('keydown', handleKeydown);

        updateSelection();
    </script>
</body>
</html>
